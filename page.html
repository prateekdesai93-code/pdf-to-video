<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:#03040a;overflow:hidden;font-family:"Inter","Roboto","DejaVu Sans",sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%),linear-gradient(180deg,rgba(3,4,10,.78) 0%,rgba(3,4,10,0) 24%,rgba(3,4,10,0) 62%,rgba(3,4,10,.8) 100%)}
.el{position:absolute;opacity:0;will-change:transform,opacity}
#brand{left:56px;top:70px;font-weight:800;font-size:30px;letter-spacing:6px;display:flex;align-items:center;gap:14px}
#brand i{width:16px;height:16px;border-radius:50%;background:#ffb400;box-shadow:0 0 18px #ffb400;display:inline-block}
#count{right:56px;top:70px;font-weight:700;font-size:30px;letter-spacing:4px;color:#9aa3b8}
#chip{left:56px;top:150px;font-weight:800;font-size:28px;letter-spacing:5px;padding:10px 22px;border-radius:40px;border:2px solid currentColor}
#head{left:56px;top:222px;width:968px;font-weight:900;font-size:78px;line-height:1.04;letter-spacing:-1.5px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
#sub{left:56px;width:968px;font-weight:500;font-size:34px;line-height:1.25;color:#b9c1d6;text-shadow:0 2px 14px rgba(0,0,0,.9)}
#cap{left:60px;width:960px;top:1500px;text-align:center;font-weight:900;font-size:66px;line-height:1.12;
  -webkit-text-stroke:10px rgba(0,0,0,.9);paint-order:stroke fill;text-shadow:0 6px 24px rgba(0,0,0,.8)}
#foot{left:56px;width:968px;top:1790px;font-size:25px;color:#7d869c;text-align:center;letter-spacing:.5px}
.card{background:rgba(8,12,24,.72);border:2px solid rgba(255,255,255,.16);border-radius:26px;padding:20px 28px}
.card .k{font-size:24px;letter-spacing:4px;font-weight:800;opacity:.85}
.card .v{font-size:78px;font-weight:900;line-height:1;margin-top:6px;letter-spacing:-2px}
.card .s{font-size:26px;color:#b9c1d6;margin-top:8px;line-height:1.25;font-weight:500}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#fade{position:absolute;inset:0;background:#03040a;opacity:1;pointer-events:none}
</style></head>
<body>
<div id="stage">
<canvas id="gl"></canvas><div id="vig"></div>
<div id="hud"></div><div id="grain"></div>
<div id="fade"></div>
</div>
